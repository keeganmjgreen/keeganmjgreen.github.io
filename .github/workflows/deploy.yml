# Deploys the blog to GitHub Pages, building the books from their latest `main`.
#
# Runs when the blog is pushed, when a book repo pushes to its `main` (each book's
# notify-blog workflow sends a `book-updated` repository_dispatch event), or manually.
# The live site records what it was built from in /build-versions.txt.

name: Jupyter Book (via myst) GitHub Pages Deploy
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [book-updated]
  workflow_dispatch: # "Run workflow" button.
env:
  # `BASE_URL` determines, relative to the root of the domain, the URL that your site is served from.
  # If your site lives at the root of the domain, at `https://mydomain.org`, set `BASE_URL=''`.
  BASE_URL: ''

permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check out the books' latest main
        run: |
          versions="blog=$GITHUB_SHA"
          for book in how-phasors-work how-electricity-markets-work; do
            git -C "$book" fetch --depth=1 origin main
            git -C "$book" checkout --detach FETCH_HEAD
            versions="$versions $book=$(git -C "$book" rev-parse HEAD)"
            rm "$book/myst.yml" # Each book's own project config; the blog's myst.yml includes the chapters.
          done
          echo "$versions" | tee build-versions.txt
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install Jupyter Book (via myst)
        run: npm install -g jupyter-book
      - name: Build HTML Assets
        run: |
          jupyter-book build --html
          mv build-versions.txt _build/html/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
